# Bot Bureau — MCP plugin template.
#
# Copy this file to mcp.yaml and edit it. mcp.yaml is gitignored, since a real one names local paths
# and credential entries.
#
#   cp mcp.example.yaml mcp.yaml
#
# A server listed here is not handed to every bot: each bot's own `mcp:` list decides which of these
# it may use. Nothing is enabled by default.
#
# Credentials are referenced, never written inline. A value starting with $ is resolved from the key
# store (data/keys.json) or the environment, so this file stays safe to share.
#
# From the app, open Plugins to one-click install common connectors (GitHub, Atlassian/Jira,
# Linear, Notion, Sentry, …). Those writes land in mcp.yaml the same way.

servers:
  # A local process, spoken to over stdio.
  - name: filesystem
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/a/directory"]

  # Official GitHub MCP (browser OAuth, same idea as ChatGPT/SuperGrok sign-in — a baked-in
  # public client id, no PAT and no OAuth App for you to register).
  - name: github
    url: https://api.githubcopilot.com/mcp/
    auth: oauth
    #
    # Expose only the tools actually needed. The official GitHub server has ninety-odd; pushing all of
    # them in both eats context and measurably lowers the odds of the model picking the right one.
    tools:
      - search_repositories
      - get_file_contents
      - create_issue

  # Alternative: a local GitHub MCP process with a PAT, if you would rather not use browser login.
  # - name: github-local
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-github"]
  #   env:
  #     GITHUB_TOKEN: $GITHUB_TOKEN   # $ = resolved from the key store or env

  # A remote connector with a static token.
  - name: notes
    url: https://example.com/mcp
    bearer_key: NOTES_TOKEN         # A key name, not the token itself

  # Official Atlassian Rovo MCP (Jira + Confluence). Authorize from the plugins panel.
  - name: atlassian
    url: https://mcp.atlassian.com/v1/mcp/authv2
    auth: oauth

  # A remote connector whose token is managed by the OAuth flow (dynamic registration, code, PKCE).
  - name: calendar
    url: https://example.com/mcp
    auth: oauth
